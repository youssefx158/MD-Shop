<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MD Streetwear</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <div>
            <div class="logo">MD</div>
            <small>STREETWEAR</small>
          </div>
        </div>
        <div class="actions">
          <button id="cartBtn" class="icon-btn" type="button" aria-label="Cart">
            🛒
            <span id="cartBadge" class="badge" style="display: none">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="products">
        <div id="empty" class="muted-box" style="display: none">
          لا توجد منتجات بعد. افتح لوحة الأدمن لإضافة منتجات.
        </div>
        <div id="grid" class="grid" aria-label="Products grid"></div>
      </section>
    </main>

    <button id="trackBtn" class="track-btn" type="button" title="تتبع طلبي">تتبع</button>

    <div id="backdrop" class="backdrop"></div>

    <aside id="drawer" class="drawer" aria-label="Cart drawer">
      <div class="drawer-head">
        <div>
          <div style="font-weight: 900">سلة التسوق</div>
          <div class="mini"><span id="cartCount">0</span> عنصر</div>
        </div>
        <button id="drawerClose" class="xbtn" type="button">✕</button>
      </div>
      <div class="drawer-body">
        <div id="cartEmpty" class="muted-box" style="display: none">سلتك فارغة.</div>
        <div id="cartList"></div>
      </div>
      <div class="drawer-foot">
        <div class="cart-row" style="margin-bottom: 10px">
          <div class="mini">الإجمالي</div>
          <div id="cartTotal" class="price sale">0</div>
        </div>
        <button id="checkoutBtn" class="btn" type="button">إتمام الشراء</button>
        <button id="continueBtn" class="btn" type="button" style="margin-top: 10px">متابعة التسوق</button>
      </div>
    </aside>

    <section id="productModal" class="modal" role="dialog" aria-modal="true" aria-label="Product details">
      <div class="modal-inner">
        <div class="modal-close">
          <div style="font-weight: 900">تفاصيل المنتج</div>
          <button id="modalClose" class="xbtn" type="button">✕</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </section>

    <section id="trackModal" class="modal" role="dialog" aria-modal="true" aria-label="Order tracking">
      <div class="modal-inner">
        <div class="modal-close">
          <div style="font-weight: 900">تتبع الطلب</div>
          <button id="trackClose" class="xbtn" type="button">✕</button>
        </div>
        <div class="panel">
          <div class="field">
            <label for="trackId">رقم الطلب</label>
            <input id="trackId" placeholder="مثال: MD-7829-XK" />
            <div id="trackErr" class="err" style="display: block; visibility: hidden">خطأ</div>
          </div>
          <button id="trackGo" class="btn" type="button">تتبع</button>
          <div id="trackResult" style="margin-top: 14px"></div>
        </div>
      </div>
    </section>

    <script type="module" src="/assets/index.js"></script>
  </body>
</html>
